name: Android Release

on:
    push:
        tags:
            - 'v*'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            
            - uses: actions/setup-java@v6
                with:
                    distribution: 'temurin'
                    java-version: '11'
            - uses: gradle/actions/setup-gradle@v6
            - run: ./gradlew assembleRelease